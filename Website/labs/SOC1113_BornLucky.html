<title>Born Lucky · SOCL 1133 Introductory Sociology · In-class lab</title>
<style>

  .tabs { display: flex; gap: 8px; margin: 14px 0 16px; flex-wrap: wrap; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }

  .entry .title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .entry .quote { font-size: 14.5px; line-height: 1.5; margin-bottom: 8px; }
  .entry .body { font-size: 13.5px; line-height: 1.55; color: var(--text-2); }

  .entry .row { font-size: 13.5px; line-height: 1.5; color: var(--text-2); margin-top: 6px; }
  .entry .row .lab { display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); margin-right: 6px; }

  /* stats */
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 150px; background: var(--wash); border-radius: 10px; padding: 12px 14px; }
  .stat .v { font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat .l { font-size: 12.5px; color: var(--text-2); line-height: 1.45; margin-top: 4px; }
  .stat.warn .v { color: var(--warn); } .stat.good .v { color: var(--good); } .stat.accent .v { color: var(--accent); } .stat.amber .v { color: var(--amber); }

  /* bars: one encoding, length only */
  .bars { display: flex; flex-direction: column; gap: 8px; }

  .choices.column { flex-direction: column; align-items: stretch; }

  .choices.column .opt { border-radius: 10px; }
  .opt:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }

  .opt.answer::before { content: "Reference: "; font-weight: 500; font-size: 12px; }

  .opt.chosen.answer::before { content: ""; }
  .opt.toggled { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .verdict { font-size: 14px; font-weight: 600; line-height: 1.5; }
  .verdict:empty { display: none; }
  .slider { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .slider input[type=range] { flex: 1; min-width: 180px; accent-color: var(--accent); height: 32px; }
  .slider .gval { font-size: 20px; font-weight: 800; min-width: 7ch; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; min-height: 40px; border-radius: 8px; border: none; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.secondary { background: none; border: 1px solid var(--border); color: var(--text-2); }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* items to sort or code */
  .item { border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; background: var(--surface); }

  .item .title { font-size: 15px; font-weight: 700; line-height: 1.45; }

  .dim.inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dim.inline .dlabel { margin-bottom: 0; min-width: 150px; }
  .ref { display: none; font-size: 13.5px; line-height: 1.55; color: var(--text-2); margin-top: 8px; padding-left: 12px; border-left: 3px solid var(--border); }
  .ref strong { color: var(--text); }
  .tag { font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; margin-right: 6px; color: var(--accent); }
  .tag.yes, .tag.good { color: var(--good); } .tag.no, .tag.warn { color: var(--warn); } .tag.arg, .tag.amber { color: var(--amber); }
  .itemnote { display: none; font-size: 13.5px; line-height: 1.55; color: var(--text-2); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .itemnote strong { color: var(--text); }
  .progress { font-size: 13.5px; color: var(--muted); }

  /* ending */
  .qs { list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: q; }
  .qs li { font-size: 15px; line-height: 1.55; padding-left: 32px; position: relative; counter-increment: q; }
  .qs li::before { content: counter(q); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: var(--page); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .field { display: block; }
  .field + .field { margin-top: 16px; }
  .field .qt { display: block; font-size: 15px; line-height: 1.5; font-weight: 600; }
  .field .qh { display: block; font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 2px; }
  textarea, input[type=text] { width: 100%; font: inherit; font-size: 15px; line-height: 1.5; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--page); color: var(--text); margin-top: 6px; }
  textarea { min-height: 110px; resize: vertical; }
  .wc { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .out { display: none; }
  .out textarea { min-height: 220px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  .forum dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14.5px; line-height: 1.5; }
  .forum dt { font-weight: 700; color: var(--text); }
  .forum dd { color: var(--text-2); }
  .nextrow { display: flex; justify-content: flex-end; margin-top: 4px; }
  footer { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding: 8px 2px 24px; }
  .srclist { font-size: 13px; line-height: 1.6; color: var(--text-2); }
  .srclist h3 { margin-top: 14px; }
  .srclist h3:first-child { margin-top: 0; }
  .srclist p { margin-top: 6px; }
  .notice { font-size: 14px; line-height: 1.45; padding: 10px 14px; background: #F9EBC8; color: #1a1a1a; border-bottom: 1px solid #9A7100; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .notice button { font: inherit; font-weight: 600; padding: 4px 12px; border: 1px solid #9A7100; border-radius: 8px; background: #fff; color: #1a1a1a; cursor: pointer; flex: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (max-width: 600px) {
    .root { padding: 12px 10px; }
    .panel { padding: 16px 14px; }
    .brow { grid-template-columns: 1fr auto; }
    .blabel { grid-column: 1 / -1; text-align: left; }
    .btrack { grid-column: 1; }
    .dim.inline .dlabel { min-width: 0; width: 100%; }
    .forum dl { grid-template-columns: 1fr; }
    h1 .sub { display: block; margin-left: 0; margin-top: 2px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  @media print {
    .tabs, .theme-btn, .btnrow, .nextrow, .notice { display: none !important; }
    .section { display: block !important; }
    .panel { break-inside: avoid; }
  }
</style>

<script>
/* ===================== LAB CONFIG ===================== */
/* Simulation model for the Run 500 lives tab, carried over unchanged from the earlier Born Lucky page.
 Its rules were written by hand. SIGMA and CUTS were calibrated on 2026-08-04 against Chetty et al. 2014, Table II. */
var BL_MODEL = (function () {
"use strict";
let RNG = Math.random;
const R = () => RNG();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const jit = () => [-1,0,0,1][Math.floor(R()*4)];


/* ---------------- the deal ---------------- */
function deal(){
  const inc = 1 + Math.floor(R()*5);
  const wealth = clamp(inc - 1 + jit(), 0, 4);
  const pedu = clamp(Math.round((inc-1)*0.7) + jit(), 0, 3);
  const hood = clamp(Math.round((inc + wealth)/2) + jit(), 1, 5);
  const fam = R() < 0.55 ? 2 : (R() < 0.75 ? 1 : 0);
  const sibs = Math.floor(R()*4);
  const raw = inc*2.6 + wealth*2.2 + pedu*1.7 + hood*1.7 + (fam===2?1.6:fam===1?0.6:0) - sibs*0.35;
  const start = clamp(Math.round((raw - 1) / (25.8 - 1) * 100), 2, 98);
  return { inc, wealth, pedu, hood, fam, sibs, start };
}
const tier = h => h.start >= 62 ? 'high' : h.start >= 34 ? 'mid' : 'low';
const T = (h, lo, mi, hi) => tier(h)==='low' ? lo : tier(h)==='mid' ? mi : hi;
const famWord = h => h.fam===2 ? 'your parents' : h.fam===1 ? 'your mom' : 'your grandma';
const famCap = h => { const w = famWord(h); return w[0].toUpperCase() + w.slice(1); };
const hoodName = h => h.hood>=4 ? 'Oak Hills' : h.hood===3 ? 'Maple Street' : 'the east side';

/* ---------------- life state ---------------- */
function newLife(h){
  return {
    h, roundIdx: 0, adult: false,
    money: 0, steady: 50, health: 62, people: 40,
    score: 0, wise: 0, wiseMax: 0,
    debt: 0, path: null,
    degree: false, cert: false, ownHome: false, ownBiz: false, gritJob: false,
    kidHelp: false,
    ledger: [], handNotes: []
  };
}
function debtWord(d){ return d===0 ? 'none' : d===1 ? 'some' : 'heavy'; }
function computeDrift(L){
  let drift;
  if (!L.adult) drift = Math.round(L.h.start/14 + R()*2);
  else {
    drift = Math.round(clamp((L.money*0.9 + (L.steady-40)*0.7 + (L.people-30)*0.5)/9, -4, 14));
    if (L.debt===2) drift -= 6; else if (L.debt===1) drift -= 2;
    drift = clamp(drift, -8, 16);
  }
  return drift;
}
function applyResult(L, r, w, label, rd){
  (r.fx||[]).forEach(([m,d])=>{
    if (!L.adult && (m==='money'||m==='steady')) return;
    L[m] = clamp((L[m]||0) + d, 0, 100);
  });
  const drift = computeDrift(L);
  const sc = r.score||0;
  L.score += sc + drift;
  L.wise += w; L.wiseMax += 2;
  if (r.note) L.handNotes.push(r.note);
  L.ledger.push({ age: rd.age, title: rd.title, choice: label, pts: sc, drift });
  return { sc, drift };
}
function computeBonuses(L){
  const bonus = [];
  const add = (label, pts, pos) => bonus.push({label, pts, pos: !!pos});
  if (L.degree) add('Finished a degree', 110);
  else if (L.cert) add('Earned a trade credential', 70);
  if (L.ownHome) add('Owns the home', 90);
  if (L.ownBiz) add('The business made it', 60);
  if (L.money>=55) add('Real savings', 70); else if (L.money>=30) add('Some savings', 35);
  if (L.debt===2) add('Heavy debt still riding', -70); else if (L.debt===1) add('Some debt left', -25);
  if (L.health>=62) add('Health held up', 55); else if (L.health<40) add('Health is a worry', -35);
  if (L.people>=60) add('Rich in people', 55);
  if (L.steady>=62) add('Steady footing', 65); else if (L.steady<40) add('Still one bad month from trouble', -35);
  if (L.h.wealth>=3) add('The family net, whether or not it was ever used', 50, true);
  return bonus;
}

/* ---------------- rounds ----------------
   Each choice: t, d, w (0-2 wisdom weight), gray (reason string), only (bool), out(h,L)->{text,fx,score,note}
   Money month round: type 'allocate', items(h,L) -> 5 items {t,d,w,keep(h,L)->{...},drop(h,L)->{...}} */

const ROUNDS = [

{ age:'Age 6', title:'Where you start',
  vign(h){
    let a = T(h,
      `You grow up in a two bedroom apartment on the east side. ${famCap(h)} ${h.fam===2?'work':'works'} long hours, and dinner is whatever is fast.`,
      `You grow up in a rented house on Maple Street. Money is tight some months and fine in others. Nobody talks about it much.`,
      `You grow up in a house with a yard in Oak Hills. There is a piano in the living room and a calendar on the fridge full of practices and lessons.`);
    if (h.sibs>=2) a += ` You share a room with ${h.sibs===2?'a sibling':'your siblings'}.`;
    if (h.fam===0) a += ` Your grandma raised her own kids already. Now she is raising you.`;
    return a + `\n\nIt is September. What do you do after school?`;
  },
  view(h){ return T(h,
    `Everyone you know lives close and works hard. Everything costs, and everyone keeps track.`,
    `Everyone you know owns some things and owes on the rest. One good year and one bad transmission apart.`,
    `Everyone you know seems to know how things work, and who to call when they do not.`); },
  choices(h,L){
    return T(h,
    [ // low
      { t:'Watch your cousins while the grown ups work', d:'Somebody has to, and you are good at it.', w:2,
        out(){ return { text:'You learn to make noodles and keep the little ones off the counter. You are six, and the family already counts on you.', fx:[['people',4]], score: 9+Math.round(R()*5), note:'Age 6: care work started early. Activities were for other schedules.' }; } },
      { t:'The free program at the rec center', d:'It runs till six, across Fenton Avenue.', w:1,
        out(){ return { text:'You get good at two sports and at crossing four lanes of traffic. Nobody can pick you up, so winter nights you walk home in the dark.', fx:[['people',4],['health',4]], score: 10+Math.round(R()*5) }; } },
      { t:'Stay in where it is quiet', d:'The apartment, the TV, the couch.', w:1,
        out(){ return { text:'You let yourself in with the key on the shoelace and keep the door locked like you were told.', fx:[], score: 5+Math.round(R()*4) }; } }
    ],
    [ // mid
      { t:'Sign up for the fall soccer league', d:'The fee fits, if nothing breaks this fall.', w:1,
        out(){ return { text:'Practices, orange slices, a whole sideline of parents. In November the water heater goes, and your mom does the math out loud at the kitchen table.', fx:[['people',5],['health',4]], score: 13+Math.round(R()*6) }; } },
      { t:'Scouts with the church troop', d:'Cheap, steady, every Tuesday.', w:2,
        out(){ return { text:'Knots, badges, a camping trip in the spring. It costs almost nothing and it is always there.', fx:[['people',4]], score: 12+Math.round(R()*5) }; } },
      { t:'The neighborhood kids and the TV', d:'The block raises you together.', w:1,
        out(){ return { text:'Bikes until the streetlights, then cartoons. An ordinary childhood, which is its own kind of luck.', fx:[['people',3],['health',2]], score: 8+Math.round(R()*5) }; } }
    ],
    [ // high
      { t:'The full calendar', d:'Soccer, piano, Mandarin on Saturdays.', w:1,
        out(){ return { text:'Every hour has a purpose and a carpool. By Sunday dinner you are six years old and tired in a way that has a schedule.', fx:[['people',5],['health',-2]], score: 20+Math.round(R()*7), note:'Age 6: the full calendar was the default setting, not a choice anyone debated.' }; } },
      { t:'Just soccer, keep the afternoons', d:'One thing, done well, and time to be a kid.', w:2,
        out(){ return { text:'You play, and then you climb the tree in the backyard because nothing else is scheduled. Your parents call it unstructured time, approvingly, to their friends.', fx:[['people',3],['health',4]], score: 16+Math.round(R()*6) }; } },
      { t:'Whatever the neighborhood kids are doing', d:'There must be neighborhood kids somewhere.', w:1,
        out(){ return { text:'You find them three cul de sacs over. Your parents exchange a look and allow it, and check the county map of registered offenders first.', fx:[['people',4]], score: 12+Math.round(R()*5) }; } }
    ]);
  }
},

{ age:'Age 10', title:'Fourth grade',
  vign(h){
    return T(h,
      `Fourth grade at Eastgate. Thirty two kids, one teacher, and reading books older than you. Your teacher is kind and tired.`,

function blLifeBlock(which) {

          b.type = "button";

            var nb = api.html("button", "btn", idx === life.stages.length - 1 ? "See where " + life.name + " ends up" : "Next stage"); nb.type = "button";

          });

        });
      }
      function finish() {
        var rows = life.summary(s);

          "<dt>Options you could not choose</dt><dd>" + (gone ? gone + " of the options in this life were not available" : "none; every option in this life was available") + "</dd></dl>";
        stageBox.innerHTML = html;

function blSideBySide() {
  return {
    type: "custom", id: "sideBySide", label: "Side by side", required: false, record: false,

      function draw() {
        if (!BL_GAME.A || !BL_GAME.B) {
          box.innerHTML = "<div class=\"note caution\">Finish both lives first. This tab fills in once Life A and Life B are both complete.</div>";
          return;
        }
        var html = "";
        BL_LIVES.A.stages.forEach(function (stA, i) {

          html += "<div class=\"box\"><div class=\"bl-age\">" + stA.age + ": " + stA.topic + "</div><div class=\"bl-cols\">";
          [["A", stA], ["B", stB]].forEach(function (pair) {
            var g = BL_GAME[pair[0]], st = pair[1];
            var picked = g.picks[i] ? g.picks[i].pick : null;
            html += "<div><div class=\"bl-colh\">Life " + pair[0] + " menu</div><ul class=\"bl-menu\">" + st.options.map(function (o) {

              return "<li" + (o.gone ? " class=\"bl-struck\"" : "") + ">" + o.t + tag + "</li>";
            }).join("") + "</ul>" + (picked ? "<p class=\"bl-small\"><strong>What happened:</strong> " + g.picks[i].text + "</p>" : "") + "</div>";
          });
          html += "</div></div>";

          "<p class=\"bl-small\"><strong>Deciding math is not your subject (age 10).</strong> In Life A, the school placed you in the lower math group the next year. In Life B, your parents emailed the teacher and hired a tutor, and you caught up by winter break.</p>" +

function blSimBlock() {
  var LEVERS = [
    { id: "inc", lab: "Parents' income", opts: [[1, "Bottom fifth"], [2, "Second fifth"], [3, "Middle fifth"], [4, "Fourth fifth"], [5, "Top fifth"]] },
    { id: "wealth", lab: "Family wealth", opts: [[0, "None"], [1, "A little"], [2, "Some savings"], [3, "A paid-off house"], [4, "A lot"]] },
    { id: "pedu", lab: "Parents' schooling", opts: [[0, "No diploma"], [1, "High school"], [2, "Some college"], [3, "College degrees"]] },
    { id: "hood", lab: "Neighborhood schools", opts: [[1, "Underfunded"], [3, "Average"], [5, "Well funded"]] },
    { id: "fam", lab: "Who raises the child", opts: [[2, "Two parents"], [1, "One parent"], [0, "A grandparent"]] },
    { id: "style", lab: "Everything else", hint: "Everything the starting point does not cover: choices, health, luck, timing, and how a person is treated.", opts: [["careful", "Goes well"], ["typical", "Average"], ["loose", "Goes badly"]] }
  ];
  var WORDS = {
    inc: ["", "bottom fifth income", "second fifth income", "middle fifth income", "fourth fifth income", "top fifth income"],
    wealth: ["no wealth", "a little wealth", "some savings", "a paid-off house", "a lot of wealth"],
    pedu: ["parents with no diploma", "parents with high school", "parents with some college", "parents with college degrees"],
    hood: { 1: "underfunded schools", 3: "average schools", 5: "well-funded schools" },
    fam: ["raised by a grandparent", "one parent", "two parents"],
    style: { careful: "everything else goes well", typical: "everything else average", loose: "everything else goes badly" }
  };
  var FIFTHS = ["Bottom fifth", "Second fifth", "Middle fifth", "Fourth fifth", "Top fifth"];
  var N = 500;

  return {
    type: "custom", id: "sim", label: "Simulation runs",
    questions: ["Set a starting point, run 500 lives, then change one setting and run again. Compare where the lives ended up with the real figures."],
    render: function (el, api) {
      blStyles();
      BL_MODEL.setRandom(api.random);
      var D = { inc: 1, wealth: 0, pedu: 1, hood: 1, fam: 1, style: "typical" };
      var last = null, kept = null, runs = [];

      var box = api.html("div", "box"); el.appendChild(box);
      LEVERS.forEach(function (lv) {
        var wrap = api.html("div", "bl-lever");
        var labId = "bl-lv-" + lv.id;
        var lab = api.html("div", "bl-lab", lv.lab); lab.id = labId; wrap.appendChild(lab);
        if (lv.hint) wrap.appendChild(api.html("div", "bl-hint", lv.hint));
        var seg = api.html("div", "bl-seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-labelledby", labId);
        lv.opts.forEach(function (o) {
          var b = api.html("button", "", o[1]); b.type = "button";
          b.setAttribute("aria-pressed", String(D[lv.id]) === String(o[0]) ? "true" : "false");
          b.addEventListener("click", function () {
            D[lv.id] = o[0];
            Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
          });
          seg.appendChild(b);
        });
        wrap.appendChild(seg); box.appendChild(wrap);
      });
      var btns = api.html("div", "btnrow");
      var run = api.html("button", "btn", "Run 500 lives"); run.type = "button";
      var keep = api.html("button", "btn secondary", "Keep this run to compare"); keep.type = "button"; keep.disabled = true;
      btns.appendChild(run); btns.appendChild(keep); box.appendChild(btns);
      var out = api.html("div", ""); out.setAttribute("aria-live", "polite"); el.appendChild(out);
      var keptBox = api.html("div", ""); el.appendChild(keptBox);

      function hand() {
        var raw = D.inc * 2.6 + D.wealth * 2.2 + D.pedu * 1.7 + D.hood * 1.7 + (D.fam === 2 ? 1.6 : D.fam === 1 ? 0.6 : 0) - 0.35;
        var start = Math.max(2, Math.min(98, Math.round((raw - 1) / (25.8 - 1) * 100)));
        return { inc: D.inc, wealth: D.wealth, pedu: D.pedu, hood: D.hood, fam: D.fam, sibs: 1, start: start };
      }
      function words(r) {
        return [WORDS.inc[r.inc], WORDS.wealth[r.wealth], WORDS.pedu[r.pedu], WORDS.hood[r.hood], WORDS.fam[r.fam], WORDS.style[r.style]].join(", ");
      }
      function simulate() {
        var h = hand(), res = [];
        for (var i = 0; i < N; i++) res.push(BL_MODEL.simulateLife(h, D.style));
        var pct = function (f) { return Math.round(100 * res.filter(f).length / N); };
        return {
          inc: D.inc, wealth: D.wealth, pedu: D.pedu, hood: D.hood, fam: D.fam, style: D.style,
          credential: pct(function (o) { return o.degree || o.cert; }),
          home: pct(function (o) { return o.ownHome; }),
          secure: pct(function (o) { return o.steady >= 62; }),
          heavy: pct(function (o) { return o.debt === 2; }),
          dest: [1, 2, 3, 4, 5].map(function (q) { return Math.round(1000 * res.filter(function (o) { return o.dest === q; }).length / N) / 10; })
        };
      }
      function block(r, title) {
        var wrap = api.html("div", "panel");
        wrap.appendChild(api.html("h3", "bl-h", title));
        wrap.appendChild(api.html("p", "bl-small", "<strong>Starting point:</strong> " + words(r) + "."));
        api.render([{ type: "bars", max: 100, caption: "Share of the 500 lives that reached each outcome by age 40. A life can reach more than one, so the bars do not add to 100.", rows: [
          { label: "Finished a degree or trade credential", value: r.credential, display: r.credential + "%" },
          { label: "Owned a home", value: r.home, display: r.home + "%" },
          { label: "Had steady, secure work", value: r.secure, display: r.secure + "%" },
          { label: "Still had heavy debt", value: r.heavy, display: r.heavy + "%" }
        ] }], wrap);
        if (r.style === "typical") {
          var real = BL_MODEL.CHETTY_ROWS[r.inc], rows = [];
          FIFTHS.forEach(function (f, i) {
            rows.push({ label: f + ": model", value: r.dest[i], display: r.dest[i] + "%" });
            rows.push({ label: f + ": real children", value: real[i], display: real[i] + "%", tone: "good" });
          });
          var miss = Math.round(r.dest.reduce(function (a, v, i) { return a + Math.abs(v - real[i]); }, 0) / 5 * 10) / 10;
          wrap.appendChild(api.html("p", "bl-small", "<strong>Which income fifth the lives ended up in as adults.</strong> Each fifth shows the model's share, then the share of real children raised in the same fifth (Chetty and others, 2014)."));
          api.render([{ type: "bars", max: 40, rows: rows, caption: "On average the model missed the real figures by " + miss + " percentage points per fifth." }], wrap);
        } else {
          wrap.appendChild(api.html("div", "note", "The real figures describe everyone raised in a given fifth, so they cannot be compared with a run where everything else goes well or badly. Set <strong>Everything else</strong> to Average to compare the model with real children."));
        }
        return wrap;
      }
      run.addEventListener("click", function () {
        last = simulate();
        out.innerHTML = ""; out.appendChild(block(last, "This run"));
        api.animateBars(out);
        keep.disabled = false;
        runs.push(words(last) + ": degree or credential " + last.credential + "%, top fifth as adults " + last.dest[4] + "%");
        api.record(runs.slice(-6));
        api.done();
      });
      keep.addEventListener("click", function () {
        if (!last) return;
        kept = last; keptBox.innerHTML = ""; keptBox.appendChild(block(kept, "Kept run, for comparison"));
        api.animateBars(keptBox);
      });
      api.onAutoplay(function () { run.click(); keep.click(); });
    }
  };
}

        if (name && E.signName !== false) L.push(name);
      } else {
        L.push([LAB.course, LAB.labLabel, LAB.title].filter(Boolean).join(' · ').toUpperCase());
        if (name) L.push('Name: ' + name);
        L.push('Assembled: ' + new Date().toLocaleString());
        L.push('');
        if (E.includeWork !== false) { var w = workLines(); if (w.length) { L.push('YOUR WORK IN THE LAB'); w.forEach(function (x) { L.push(x); }); L.push(''); } }
        ending.fields.forEach(function (f) {
          L.push('QUESTION ' + (f.i + 1) + (f.q.short ? ' (' + f.q.short + ')' : ''));
          if (E.includePrompts) L.push(txt(f.q.prompt));
          L.push(f.ta.value.trim() || '(blank)'); L.push('');
        });
      }
      return L.join('\n').replace(/\n+$/, '\n');
    }
    ending.build = assemble;
    build.addEventListener('click', function () {
      ota.value = assemble();
      out.style.display = 'block'; copy.disabled = false; if (dl2) dl2.disabled = false;
      var blanks = ending.fields.filter(function (f) { return !f.ta.value.trim(); }).length;
      var unfinished = BLOCKS.filter(function (bk) { return !bk.complete(); }).length;
      var msg = [];
      if (blanks) msg.push(blanks + ' of ' + ending.fields.length + ' questions are still blank.');
      if (unfinished && E.includeWork !== false && !forum) msg.push('Some parts of the lab are not finished yet, and they show as not answered.');
      note.textContent = msg.length ? 'Assembled. ' + msg.join(' ') + ' You can finish them and assemble again.' : (forum ? 'Done. Copy the text below and paste it into ' + dest + '.' : 'Assembled. Copy the text below and paste it into ' + dest + '.');
    });
    copy.addEventListener('click', function () {
      var okMsg = 'Copied. Paste it into ' + dest + '.';
      var failMsg = 'Your browser blocked automatic copying. The text is selected, so press Ctrl+C (or Cmd+C on a Mac) to copy it.';
      ota.focus(); ota.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      function done(v) { note.textContent = v ? okMsg : failMsg; if (v) dirty = false; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ota.value).then(function () { done(true); }, function () { done(ok); });
      else done(ok);
    });
    if (dl2) dl2.addEventListener('click', function () {
      try {
        var blob = new Blob([ota.value], { type: 'text/plain' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = (E.fileName || (LAB.labLabel || LAB.title || 'lab').replace(/[^A-Za-z0-9]+/g, '_')) + '_' + ((nameIn && nameIn.value.trim()) || 'answers').replace(/[^A-Za-z0-9]+/g, '_') + '.txt';
        document.body.appendChild(a); a.click(); a.remove(); dirty = false;
        note.textContent = 'Downloaded. If nothing appeared, use the copy button instead.';
      } catch (e) { note.textContent = 'This browser blocked the download. Use the copy button instead.'; }
    });
  }
  function workLines() {
    var L = [], lastGroup = null;
    BLOCKS.forEach(function (bk) {
      var lines = bk.lines(); if (!lines.length) return;
      if (bk.group !== lastGroup) { if (lastGroup !== null) L.push(''); L.push(txt(bk.group).toUpperCase()); lastGroup = bk.group; }
      lines.forEach(function (x) { L.push(x); });
    });
    return L;
  }
  window.addEventListener('beforeunload', function (e) { if (dirty && LAB.warnOnLeave !== false) { e.preventDefault(); e.returnValue = ''; return ''; } });

  /* ---------- sources ---------- */
  arr(LAB.sources).forEach(function (s) { addSource(typeof s === 'string' ? 'Readings and other sources' : (s.group || 'Readings and other sources'), typeof s === 'string' ? s : s.html); });
  function renderSources(container) {
    var groups = [];
    SOURCES.forEach(function (s) { var g = groups.filter(function (x) { return x.name === s.group; })[0]; if (!g) { g = { name: s.group, items: [] }; groups.push(g); } g.items.push(s.html); });
    var box = el('div', 'srclist');
    groups.forEach(function (g) { box.appendChild(el('h3', '', g.name)); g.items.forEach(function (h) { box.appendChild(el('p', '', h)); }); });
    if (LAB.retrieved) box.appendChild(el('p', 'src', 'Sources retrieved ' + LAB.retrieved + '.'));
    container.appendChild(box);
  }
  if (SOURCES.length || LAB.retrieved) {
    var sp = el('div', 'panel'); sp.appendChild(el('h2', '', 'Sources'));
    renderSources(sp);
    if (sourcesAs === 'tab') { SECTIONS[SECTIONS.length - 1].node.appendChild(sp); }
    else app.appendChild(sp);
  } else if (sourcesAs === 'tab') {
    var last = SECTIONS.pop(); last.node.remove(); var lt = document.getElementById('tab-' + last.id); if (lt) lt.remove();
  }

  /* ---------- footer ---------- */
  var foot = el('footer');
  foot.setAttribute('role', 'contentinfo');
  foot.innerHTML = LAB.footer || ('Built for ' + ([LAB.course, LAB.institution].filter(Boolean).join(', ') || 'this course') + '.' + (LAB.retrieved ? ' Sources retrieved ' + LAB.retrieved + '.' : '') + (['response', 'forum'].indexOf(E.mode) !== -1 ? ' Your clicks and answers stay on this page. Nothing is recorded or sent anywhere unless you copy or download it yourself.' : ' Your clicks stay on this page. Nothing is recorded or sent anywhere.'));
  app.appendChild(foot);

  /* ---------- small screen notice ---------- */
  if (window.innerWidth < 740 && LAB.smallScreenNotice !== false) {
    var nb = el('div', 'notice'); nb.setAttribute('role', 'region'); nb.setAttribute('aria-label', 'Display notice');
    nb.appendChild(el('span', '', 'You are on a small screen. This page works here, but it is easier to use on a computer.'));
    var ok = el('button', '', 'OK'); ok.type = 'button'; ok.addEventListener('click', function () { nb.remove(); }); nb.appendChild(ok);
    document.body.insertBefore(nb, document.body.firstChild);
  }

  requestAnimationFrame(function () { animateBars(SECTIONS[0] && SECTIONS[0].node); });

  /* ---------- test and review hooks (used by scripts/check_lab.py) ---------- */
  window.__LAB = {
    config: LAB,
    sections: function () { return SECTIONS.map(function (s) { return { id: s.id, tab: s.tab }; }); },
    activate: function (id) { activate(id, true); },
    blocks: function () { return BLOCKS.map(function (b) { return { id: b.id, kind: b.kind, group: txt(b.group), complete: b.complete() }; }); },
    incomplete: function () { return BLOCKS.filter(function (b) { return !b.complete(); }).map(function (b) { return b.id + ' (' + b.kind + ')'; }); },
    autoplay: function (mode) {
      for (var pass = 0; pass < 4; pass++) SECTIONS.forEach(function (s) { activate(s.id, true); BLOCKS.forEach(function (b) { if (b.sec !== s.id || !b.play) return; try { b.play(mode || 'first'); } catch (e) { console.error('autoplay ' + b.id + ': ' + e.message); } }); });
      activate(SECTIONS[0].id, true);
    },
    fillEnding: function (prefix) { ending.fields.forEach(function (f) { f.ta.value = (prefix || 'Test answer') + ' ' + (f.i + 1); f.ta.dispatchEvent(new Event('input')); }); var n = app.querySelector('input[autocomplete=name]'); if (n) n.value = 'Test Student'; },
    submission: function () { return ending.build ? ending.build() : null; },
    endingQuestions: function () { return ending.fields.map(function (f) { return { prompt: txt(f.q.prompt), short: f.q.short || null }; }); },
    results: RESULTS,
    sources: function () { return SOURCES.map(function (s) { return s.group + ': ' + txt(s.html); }); },
    questionList: function () {
      var L = ['# Question list: ' + txt(LAB.title), ''];
      var lastG = null;
      BLOCKS.forEach(function (b) { var g = txt(b.group); if (g !== lastG) { L.push('', '## ' + g); lastG = g; } b.questions().forEach(function (q) { L.push('- ' + q); }); });
      if (E.mode && E.mode !== 'none') {
        L.push('', '## ' + (E.tab || defaultEndingTab(E.mode)) + ' (' + E.mode + ')');
        arr(E.questions).forEach(function (q, i) { var p = typeof q === 'string' ? q : q.prompt; L.push((i + 1) + '. ' + txt(p) + (q.hint ? ' [' + txt(q.hint) + ']' : '')); });
      }
      return L.join('\n');
    },
    seed: seed
  };
})();
</script>
