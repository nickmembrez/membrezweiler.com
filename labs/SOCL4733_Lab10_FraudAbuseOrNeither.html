      if (blanks) msg.push(blanks + ' of ' + ending.fields.length + ' questions are still blank.');
      if (unfinished && E.includeWork !== false && !forum) msg.push('Some parts of the lab are not finished yet, and they show as not answered.');
      note.textContent = msg.length ? 'Assembled. ' + msg.join(' ') + ' You can finish them and assemble again.' : (forum ? 'Done. Copy the text below and paste it into ' + dest + '.' : 'Assembled. Copy the text below and paste it into ' + dest + '.');
    });
    copy.addEventListener('click', function () {
      var okMsg = 'Copied. Paste it into ' + dest + '.';
      var failMsg = 'Your browser blocked automatic copying. The text is selected, so press Ctrl+C (or Cmd+C on a Mac) to copy it.';
      ota.focus(); ota.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      function done(v) { note.textContent = v ? okMsg : failMsg; if (v) dirty = false; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ota.value).then(function () { done(true); }, function () { done(ok); });
      else done(ok);
    });
    if (dl2) dl2.addEventListener('click', function () {
      try {
        var blob = new Blob([ota.value], { type: 'text/plain' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = (E.fileName || (LAB.labLabel || LAB.title || 'lab').replace(/[^A-Za-z0-9]+/g, '_')) + '_' + ((nameIn && nameIn.value.trim()) || 'answers').replace(/[^A-Za-z0-9]+/g, '_') + '.txt';
        document.body.appendChild(a); a.click(); a.remove(); dirty = false;
        note.textContent = 'Downloaded. If nothing appeared, use the copy button instead.';
      } catch (e) { note.textContent = 'This browser blocked the download. Use the copy button instead.'; }
    });
  }
  function workLines() {
    var L = [], lastGroup = null;
    BLOCKS.forEach(function (bk) {
      var lines = bk.lines(); if (!lines.length) return;
      if (bk.group !== lastGroup) { if (lastGroup !== null) L.push(''); L.push(txt(bk.group).toUpperCase()); lastGroup = bk.group; }
      lines.forEach(function (x) { L.push(x); });
    });
    return L;
  }
  window.addEventListener('beforeunload', function (e) { if (dirty && LAB.warnOnLeave !== false) { e.preventDefault(); e.returnValue = ''; return ''; } });

  /* ---------- sources ---------- */
  arr(LAB.sources).forEach(function (s) { addSource(typeof s === 'string' ? 'Readings and other sources' : (s.group || 'Readings and other sources'), typeof s === 'string' ? s : s.html); });
  function renderSources(container) {
    var groups = [];
    SOURCES.forEach(function (s) { var g = groups.filter(function (x) { return x.name === s.group; })[0]; if (!g) { g = { name: s.group, items: [] }; groups.push(g); } g.items.push(s.html); });
    var box = el('div', 'srclist');
    groups.forEach(function (g) { box.appendChild(el('h3', '', g.name)); g.items.forEach(function (h) { box.appendChild(el('p', '', h)); }); });
    if (LAB.retrieved) box.appendChild(el('p', 'src', 'Sources retrieved ' + LAB.retrieved + '.'));
    container.appendChild(box);
  }
  if (SOURCES.length || LAB.retrieved) {
    var sp = el('div', 'panel'); sp.appendChild(el('h2', '', 'Sources'));
    renderSources(sp);
    if (sourcesAs === 'tab') { SECTIONS[SECTIONS.length - 1].node.appendChild(sp); }
    else app.appendChild(sp);
  } else if (sourcesAs === 'tab') {
    var last = SECTIONS.pop(); last.node.remove(); var lt = document.getElementById('tab-' + last.id); if (lt) lt.remove();
  }

  /* ---------- footer ---------- */
  var foot = el('footer');
  foot.setAttribute('role', 'contentinfo');
  foot.innerHTML = LAB.footer || ('Built for ' + ([LAB.course, LAB.institution].filter(Boolean).join(', ') || 'this course') + '.' + (LAB.retrieved ? ' Sources retrieved ' + LAB.retrieved + '.' : '') + (['response', 'forum'].indexOf(E.mode) !== -1 ? ' Your clicks and answers stay on this page. Nothing is recorded or sent anywhere unless you copy or download it yourself.' : ' Your clicks stay on this page. Nothing is recorded or sent anywhere.'));
  app.appendChild(foot);

  /* ---------- small screen notice ---------- */
  if (window.innerWidth < 740 && LAB.smallScreenNotice !== false) {
    var nb = el('div', 'notice'); nb.setAttribute('role', 'region'); nb.setAttribute('aria-label', 'Display notice');
    nb.appendChild(el('span', '', 'You are on a small screen. This page works here, but it is easier to use on a computer.'));
    var ok = el('button', '', 'OK'); ok.type = 'button'; ok.addEventListener('click', function () { nb.remove(); }); nb.appendChild(ok);
    document.body.insertBefore(nb, document.body.firstChild);
  }

  requestAnimationFrame(function () { animateBars(SECTIONS[0] && SECTIONS[0].node); });

  /* ---------- test and review hooks (used by scripts/check_lab.py) ---------- */
  window.__LAB = {
    config: LAB,
    sections: function () { return SECTIONS.map(function (s) { return { id: s.id, tab: s.tab }; }); },
    activate: function (id) { activate(id, true); },
    blocks: function () { return BLOCKS.map(function (b) { return { id: b.id, kind: b.kind, group: txt(b.group), complete: b.complete() }; }); },
    incomplete: function () { return BLOCKS.filter(function (b) { return !b.complete(); }).map(function (b) { return b.id + ' (' + b.kind + ')'; }); },
    autoplay: function (mode) {
      for (var pass = 0; pass < 4; pass++) SECTIONS.forEach(function (s) { activate(s.id, true); BLOCKS.forEach(function (b) { if (b.sec !== s.id || !b.play) return; try { b.play(mode || 'first'); } catch (e) { console.error('autoplay ' + b.id + ': ' + e.message); } }); });
      activate(SECTIONS[0].id, true);
    },
    fillEnding: function (prefix) { ending.fields.forEach(function (f) { f.ta.value = (prefix || 'Test answer') + ' ' + (f.i + 1); f.ta.dispatchEvent(new Event('input')); }); var n = app.querySelector('input[autocomplete=name]'); if (n) n.value = 'Test Student'; },
    submission: function () { return ending.build ? ending.build() : null; },
    endingQuestions: function () { return ending.fields.map(function (f) { return { prompt: txt(f.q.prompt), short: f.q.short || null }; }); },
    results: RESULTS,
    sources: function () { return SOURCES.map(function (s) { return s.group + ': ' + txt(s.html); }); },
    questionList: function () {
      var L = ['# Question list: ' + txt(LAB.title), ''];
      var lastG = null;
      BLOCKS.forEach(function (b) { var g = txt(b.group); if (g !== lastG) { L.push('', '## ' + g); lastG = g; } b.questions().forEach(function (q) { L.push('- ' + q); }); });
      if (E.mode && E.mode !== 'none') {
        L.push('', '## ' + (E.tab || defaultEndingTab(E.mode)) + ' (' + E.mode + ')');
        arr(E.questions).forEach(function (q, i) { var p = typeof q === 'string' ? q : q.prompt; L.push((i + 1) + '. ' + txt(p) + (q.hint ? ' [' + txt(q.hint) + ']' : '')); });
      }
      return L.join('\n');
    },
    seed: seed
  };
})();
</script>
